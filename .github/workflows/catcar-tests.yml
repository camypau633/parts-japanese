name: CatCar parser and crawler tests

on:
  push:
    branches:
      - main
    paths:
      - "tools/catcar_poc/**"
      - "schemas/**"
      - "requirements-dev.txt"
      - ".github/workflows/catcar-tests.yml"
  pull_request:
    paths:
      - "tools/catcar_poc/**"
      - "schemas/**"
      - "requirements-dev.txt"
      - ".github/workflows/catcar-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catcar-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run CatCar test suite
        run: python -m unittest discover -s tools/catcar_poc/tests -v

      - name: Install Playwright browser for Toyota pagination probe
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe Toyota pagination on one known CatCar group
        run: |
          python -m tools.catcar_poc.probe_toyota_pagination \
            --output out/toyota-pagination-probe \
            --timeout 45000
      - name: Upload Toyota pagination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toyota-pagination-probe-${{ github.run_id }}
          path: out/toyota-pagination-probe/
          if-no-files-found: warn
          retention-days: 14
