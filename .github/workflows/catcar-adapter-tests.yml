name: CatCar adapter unit tests
on:
  push:
    paths:
      - 'tools/catcar_poc/**'
      - 'schemas/**'
      - 'requirements-dev.txt'
      - '.github/workflows/catcar-adapter-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Run parser, adapter and schema tests
        run: python -m unittest discover -s tools/catcar_poc/tests -v
