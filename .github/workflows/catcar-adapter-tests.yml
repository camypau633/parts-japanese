name: CatCar adapter unit tests
on:
  push:
    paths:
      - 'tools/catcar_poc/**'
      - '.github/workflows/catcar-adapter-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Python 3.8-compatible adapter tests
        run: python -m unittest discover -s tools/catcar_poc/tests -v
