name: CatCar alternate vehicle discovery
on:
  push:
    paths:
      - '.github/workflows/catcar-alt-vehicle-probe.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Extract Camry groups and sample OEM rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import re, urllib.request
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          BASE="https://www.catcar.info"
          CATALOG="https://www.catcar.info/toyota/?%3D%3D"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,r.geturl(),r.read().decode("utf-8","replace")

          class GroupParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.groups=[]; self.active=False; self.href=""; self.text=""
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="a" and "groups-parts__item" in a.get("class","").split():
                      self.active=True; self.href=a.get("href",""); self.text=""
              def handle_data(self,data):
                  if self.active: self.text+=data
              def handle_endtag(self,tag):
                  if tag=="a" and self.active:
                      label=" ".join(unescape(self.text).split())
                      if self.href and label: self.groups.append((label,urljoin(BASE,self.href)))
                      self.active=False

          class PartParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rows=[]; self.current=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="tr" and a.get("onclick"):
                      self.current={"onclick":a["onclick"],"text":""}
                      self.rows.append(self.current)
              def handle_data(self,data):
                  if self.current is not None: self.current["text"]+=data
              def handle_endtag(self,tag):
                  if tag=="tr": self.current=None

          status,_,catalog=get(CATALOG)
          print("CATALOG_HTTP",status)
          open("out/camry-catalog.html","w",encoding="utf-8").write(catalog)
          gp=GroupParser(); gp.feed(catalog); groups=gp.groups
          print("GROUP_COUNT",len(groups))
          for label,url in groups: print("GROUP",label,url)
          target=next((x for x in groups if "15-02" in x[0] and "ФИЛЬТР" in x[0].upper()),None)
          if not target: raise SystemExit("OIL_FILTER_GROUP_NOT_FOUND")
          print("TARGET_GROUP",target[0])
          status,group_url,group_html=get(target[1])
          print("GROUP_HTTP",status,"BYTES",len(group_html),"URL",group_url)
          open("out/camry-oil-filter-group.html","w",encoding="utf-8").write(group_html)
          pp=PartParser(); pp.feed(group_html)
          print("PART_ROWS",len(pp.rows))
          tested=0
          for row in pp.rows:
              args=row["onclick"].split(chr(39))
              if len(args)<2 or "getArticles" not in row["onclick"] or ", 80," not in row["onclick"]: continue
              token=args[1]
              row_text=" ".join(row["text"].split())
              ajax="https://www.catcar.info/toyota/?l="+token+"&st=81"
              try:
                  st,final,body=get(ajax)
                  text_only=re.sub(r"<[^>]+>"," ",body)
                  codes=re.findall(r"\b[A-Z0-9]{5}-[A-Z0-9]{5}\b",text_only,re.I)
                  print("PART_AJAX",row_text,"HTTP",st,"BYTES",len(body),"OEM",",".join(dict.fromkeys(codes)))
                  open("out/part-%02d.html"%tested,"w",encoding="utf-8").write(body)
                  tested+=1
              except Exception as e:
                  print("PART_ERROR",repr(e))
              if tested>=5: break
          print("TESTED_PART_AJAX",tested)
          if tested==0: raise SystemExit("NO_PART_AJAX_ROWS_MATCHED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-camry-groups-and-oem
          path: out/
          retention-days: 7
