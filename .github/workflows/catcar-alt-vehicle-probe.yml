name: CatCar alternate vehicle discovery
on:
  push:
    paths:
      - '.github/workflows/catcar-alt-vehicle-probe.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Follow Camry modification and inspect groups
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import re, urllib.request
          from html.parser import HTMLParser

          catalog = "https://www.catcar.info/toyota/?l=bWFya2V0PT1qYXBhbnx8c3Q9PTMwfHxzdHM9PXsiMTAiOiJcdTA0MjBcdTA0NGJcdTA0M2RcdTA0M2VcdTA0M2EiLCIyMCI6Ilx1MDQyZlx1MDQxZlx1MDQxZVx1MDQxZFx1MDQxOFx1MDQyZiIsIjMwIjoiQ0FNUlkgMjg0MTcwIn18fGNhdGFsb2c9PTI4NDE3MHx8cmVjPT1BMQ%3D%3D"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,r.geturl(),r.read().decode("utf-8","replace")
          class Rows(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rows=[]; self.row=None; self.cell=None
              def handle_starttag(self,tag,attrs):
                  if tag=="tr": self.row=[]
                  elif tag in ("td","th") and self.row is not None: self.cell=""
              def handle_data(self,data):
                  if self.cell is not None: self.cell+=data
              def handle_endtag(self,tag):
                  if tag in ("td","th") and self.cell is not None:
                      self.row.append(" ".join(self.cell.split())); self.cell=None
                  elif tag=="tr" and self.row is not None:
                      if self.row: self.rows.append(self.row)
                      self.row=None
          status,final,html=get(catalog)
          print("CATALOG",status,len(html))
          match=re.search(r'<tr\\b[^>]*>\\s*<td[^>]*>\\s*ACV30-AEPNK.*?</tr>',html,re.I|re.S)
          if not match: raise SystemExit("MODIFICATION_ROW_NOT_FOUND")
          href=re.search(r'href=["\\']([^"\\']+)["\\']',match.group(0),re.I)
          if not href: raise SystemExit("MODIFICATION_HREF_NOT_FOUND")
          mod_url=href.group(1).replace("&amp;","&")
          if mod_url.startswith("http://"): mod_url="https://"+mod_url[len("http://"):]
          print("MODIFICATION_URL",mod_url)
          status,final,mod_html=get(mod_url)
          print("MODIFICATION_HTTP",status,"BYTES",len(mod_html),"URL",final)
          parser=Rows(); parser.feed(mod_html)
          print("MODIFICATION_ROWS",len(parser.rows))
          for row in parser.rows[:100]: print("MOD_ROW",row)
          open("out/camry-acv30-aepnk.html","w",encoding="utf-8").write(mod_html)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-camry-modification
          path: out/
          retention-days: 7
