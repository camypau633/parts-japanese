name: CatCar alternate vehicle discovery
on:
  push:
    paths:
      - '.github/workflows/catcar-alt-vehicle-probe.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract Camry modification links and onclick tokens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, re, urllib.request
          from html.parser import HTMLParser

          URL = "https://www.catcar.info/toyota/?l=bWFya2V0PT1qYXBhbnx8c3Q9PTMwfHxzdHM9PXsiMTAiOiJcdTA0MjBcdTA0NGJcdTA0M2RcdTA0M2VcdTA0M2EiLCIyMCI6Ilx1MDQyZlx1MDQxZlx1MDQxZVx1MDQxZFx1MDQxOFx1MDQyZiIsIjMwIjoiQ0FNUlkgMjg0MTcwIn18fGNhdGFsb2c9PTI4NDE3MHx8cmVjPT1BMQ%3D%3D"
          req=urllib.request.Request(URL,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode("utf-8","replace")
              print("HTTP",r.status,"BYTES",len(html))

          for code in ("ACV30-AEPNK","ACV30-AEPSK","ACV35-AEPNK"):
              pos=html.find(code)
              print("MOD_SNIPPET",code,repr(html[max(0,pos-900):pos+1300] if pos>=0 else "NOT_FOUND"))

          # Extract all hrefs and onclick values from raw source around modification rows.
          matches=[]
          for m in re.finditer(r"<tr\\b[^>]*>.*?</tr>",html,re.I|re.S):
              row=m.group(0)
              if any(x in row for x in ("ACV30-AEPNK","ACV30-AEPSK","ACV35-AEPNK")):
                  matches.append(row)
          print("MATCHED_ROWS",len(matches))
          open("out/camry-modification-rows.html","w",encoding="utf-8").write("\\n".join(matches))
          for row in matches:
              print("ROW_HTML",row[:3000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-camry-modification-rows
          path: out/
          retention-days: 7
