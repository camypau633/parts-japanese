name: CatCar alternate vehicle discovery
on:
  push:
    paths:
      - '.github/workflows/catcar-alt-vehicle-probe.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Extract Camry groups and sample OEM rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import re, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          BASE="https://www.catcar.info"
          CATALOG="https://www.catcar.info/toyota/?l=bWFya2V0PT1qYXBhbnx8c3Q9PTMwfHxzdHM9PXsiMTAiOiJcdTA0MjBcdTA0NGJcdTA0M2RcdTA0M2VcdTA0M2EiLCIyMCI6Ilx1MDQyZlx1MDQxZlx1MDQxZVx1MDQxZFx1MDQxOFx1MDQyZiIsIjMwIjoiQ0FNUlkgMjg0MTcwIn18fGNhdGFsb2c9PTI4NDE3MHx8cmVjPT1BMQ%3D%3D"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,r.geturl(),r.read().decode("utf-8","replace")
          class CatalogLinks(HTMLParser):
              def __init__(self):
                  super().__init__(); self.items=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      a=dict(attrs)
                      if "groups-parts__item" in a.get("class","").split():
                          self.items.append((a.get("href",""),""))
              def handle_data(self,data):
                  if self.items and not self.items[-1][1]:
                      self.items[-1]=(self.items[-1][0],data.strip())
          class PartRows(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rows=[]; self.current=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="tr" and "onclick" in a:
                      self.current={"onclick":a["onclick"],"text":""}
                      self.rows.append(self.current)
              def handle_data(self,data):
                  if self.current is not None: self.current["text"]+=data
              def handle_endtag(self,tag):
                  if tag=="tr": self.current=None

          status,_,catalog=get(CATALOG)
          print("CATALOG_HTTP",status)
          cp=CatalogLinks(); cp.feed(catalog)
          groups=[]
          for href,label in cp.items:
              label=" ".join(label.split())
              if href and label: groups.append((label,urljoin(BASE,href.replace("&amp;","&"))))
          print("GROUP_COUNT",len(groups))
          for label,url in groups: print("GROUP",label,url)
          target=next((x for x in groups if x[0].startswith("15-02")),None)
          if not target: raise SystemExit("OIL_FILTER_GROUP_NOT_FOUND")
          print("TARGET_GROUP",target[0])
          status,group_url,group_html=get(target[1])
          print("GROUP_HTTP",status,"BYTES",len(group_html),"URL",group_url)
          open("out/camry-oil-filter-group.html","w",encoding="utf-8").write(group_html)
          pp=PartRows(); pp.feed(group_html)
          print("PART_ROWS",len(pp.rows))
          token_re=re.compile(r"getArticles\\(this,\\s*'([^']+)'\\s*,\\s*80")
          tested=0
          for row in pp.rows:
              m=token_re.search(row["onclick"])
              if not m: continue
              token=m.group(1)
              ajax=urljoin(BASE,"/toyota/")+"?l="+token+"&st=81"
              try:
                  st,final,body=get(ajax)
                  codes=re.findall(r">\\s*([A-Z0-9]{2,}(?:-[A-Z0-9]+)+|[A-Z]{1,4}[0-9]{4,}[A-Z0-9]*)\\s*<",body,re.I)
                  print("PART_AJAX", " ".join(row["text"].split()),"HTTP",st,"BYTES",len(body),"OEM",",".join(dict.fromkeys(codes)))
                  open("out/part-%02d.html"%tested,"w",encoding="utf-8").write(body)
                  tested+=1
              except Exception as e:
                  print("PART_ERROR",repr(e))
              if tested>=5: break
          print("TESTED_PART_AJAX",tested)
          if tested==0: raise SystemExit("NO_PART_AJAX_ROWS_MATCHED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-camry-groups-and-oem
          path: out/
          retention-days: 7
