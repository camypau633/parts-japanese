name: CatCar alternate vehicle discovery
on:
  push:
    paths:
      - '.github/workflows/catcar-alt-vehicle-probe.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Japan catalog navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          import re
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          URL = "https://www.catcar.info/toyota/?l=bWFya2V0PT1qYXBhbnx8c3Q9PTIwfHxzdHM9PXsiMTAiOiJcdTA0MjBcdTA0NGJcdTA0M2RcdTA0M2VcdTA0M2EiLCIyMCI6Ilx1MDQyZlx1MDQxZlx1MDQxZVx1MDQxZFx1MDQxOFx1MDQyZiJ9"
          req = urllib.request.Request(URL, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
              print("JAPAN_HTTP", r.status, "BYTES", len(html), "FINAL_URL", r.url)

          class Nav(HTMLParser):
              def __init__(self):
                  super().__init__(); self.items=[]; self.cur=None
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag in ("a","tr","button","div") and (a.get("href") or a.get("onclick")):
                      self.cur={"tag":tag,"href":a.get("href",""),"onclick":a.get("onclick",""),"text":""}
              def handle_data(self,data):
                  if self.cur is not None: self.cur["text"] += data
              def handle_endtag(self,tag):
                  if self.cur is not None and tag==self.cur["tag"]:
                      self.cur["text"]=" ".join(self.cur["text"].split())
                      self.items.append(self.cur); self.cur=None

          p=Nav(); p.feed(html)
          items=[]
          for x in p.items:
              if x["href"]: x["href"]=urljoin(URL,x["href"])
              if x["text"] or x["onclick"]: items.append(x)
          open("out/japan-navigation.json","w",encoding="utf-8").write(json.dumps(items,ensure_ascii=False,indent=2))
          print("NAV_ITEMS",len(items))
          for x in items[:100]:
              print("NAV",json.dumps(x,ensure_ascii=False))
          print("PAGE_TEXT", " ".join(re.sub(r"<[^>]+>"," ",html).split())[:2500])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-japan-navigation
          path: out/
          retention-days: 7
