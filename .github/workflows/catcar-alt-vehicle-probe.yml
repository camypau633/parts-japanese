name: CatCar alternate vehicle discovery
on:
  push:
    paths:
      - '.github/workflows/catcar-alt-vehicle-probe.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Extract Camry groups and sample OEM rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import re, urllib.request
          from html import unescape
          from urllib.parse import urljoin

          BASE="https://www.catcar.info"
          CATALOG="https://www.catcar.info/toyota/?l=bWFya2V0PT1qYXBhbnx8c3Q9PTMwfHxzdHM9PXsiMTAiOiJcdTA0MjBcdTA0NGJcdTA0M2RcdTA0M2VcdTA0M2EiLCIyMCI6Ilx1MDQyZlx1MDQxZlx1MDQxZVx1MDQxZFx1MDQxOFx1MDQyZiIsIjMwIjoiQ0FNUlkgMjg0MTcwIn18fGNhdGFsb2c9PTI4NDE3MHx8cmVjPT1BMQ%3D%3D"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,r.geturl(),r.read().decode("utf-8","replace")
          status,_,catalog=get(CATALOG)
          print("CATALOG_HTTP",status)
          open("out/camry-catalog.html","w",encoding="utf-8").write(catalog)
          blocks=re.findall(r'<a\\b(?=[^>]*class=["\\'][^"\\']*groups-parts__item)[^>]*>.*?</a>',catalog,re.I|re.S)
          groups=[]
          for block in blocks:
              h=re.search(r'href=["\\']([^"\\']+)["\\']',block,re.I)
              t=re.search(r'class=["\\'][^"\\']*groups-parts__title[^"\\']*["\\'][^>]*>(.*?)</span>',block,re.I|re.S)
              if h and t:
                  label=" ".join(unescape(re.sub(r'<[^>]+>',' ',t.group(1))).split())
                  url=urljoin(BASE,unescape(h.group(1)))
                  groups.append((label,url))
          print("GROUP_COUNT",len(groups))
          for label,url in groups: print("GROUP",label,url)
          target=next((x for x in groups if "15-02" in x[0] and "ФИЛЬТР" in x[0]),None)
          if not target: raise SystemExit("OIL_FILTER_GROUP_NOT_FOUND")
          print("TARGET_GROUP",target[0])
          status,group_url,group_html=get(target[1])
          print("GROUP_HTTP",status,"BYTES",len(group_html),"URL",group_url)
          open("out/camry-oil-filter-group.html","w",encoding="utf-8").write(group_html)
          rows=re.findall(r'<tr\\b[^>]*onclick=["\\']([^"\\']*getArticles\\(this,\\s*\\'[^"\\']+\\'[^"\\']*)["\\'][^>]*>(.*?)</tr>',group_html,re.I|re.S)
          print("PART_ROWS",len(rows))
          tested=0
          for onclick,row_html in rows:
              m=re.search(r"getArticles\\(this,\\s*'([^']+)'\\s*,\\s*80",onclick,re.I)
              if not m: continue
              token=m.group(1)
              row_text=" ".join(re.sub(r'<[^>]+>',' ',row_html).split())
              ajax="https://www.catcar.info/toyota/?l="+token+"&st=81"
              try:
                  st,final,body=get(ajax)
                  codes=re.findall(r'>\\s*([A-Z0-9]{2,}(?:-[A-Z0-9]+)+|[A-Z]{1,4}[0-9]{4,}[A-Z0-9]*)\\s*<',body,re.I)
                  print("PART_AJAX",row_text,"HTTP",st,"BYTES",len(body),"OEM",",".join(dict.fromkeys(codes)))
                  open("out/part-%02d.html"%tested,"w",encoding="utf-8").write(body)
                  tested+=1
              except Exception as e:
                  print("PART_ERROR",repr(e))
              if tested>=5: break
          print("TESTED_PART_AJAX",tested)
          if tested==0: raise SystemExit("NO_PART_AJAX_ROWS_MATCHED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-camry-groups-and-oem
          path: out/
          retention-days: 7
