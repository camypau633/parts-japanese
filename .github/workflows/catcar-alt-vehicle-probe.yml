name: CatCar alternate vehicle discovery
on:
  push:
    paths:
      - '.github/workflows/catcar-alt-vehicle-probe.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Camry catalog and modification navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser

          URL = "https://www.catcar.info/toyota/?l=bWFya2V0PT1qYXBhbnx8c3Q9PTMwfHxzdHM9PXsiMTAiOiJcdTA0MjBcdTA0NGJcdTA0M2RcdTA0M2VcdTA0M2EiLCIyMCI6Ilx1MDQyZlx1MDQxZlx1MDQxZVx1MDQxZFx1MDQxOFx1MDQyZiIsIjMwIjoiQ0FNUlkgMjg0MTcwIn18fGNhdGFsb2c9PTI4NDE3MHx8cmVjPT1BMQ%3D%3D"
          req=urllib.request.Request(URL,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode("utf-8","replace")
              print("CAMRY_HTTP",r.status,"BYTES",len(html),"URL",r.url)
          class Rows(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rows=[]; self.row=None; self.cell=None
              def handle_starttag(self,tag,attrs):
                  if tag=="tr": self.row=[]
                  elif tag in ("td","th") and self.row is not None: self.cell=""
              def handle_data(self,data):
                  if self.cell is not None: self.cell+=data
              def handle_endtag(self,tag):
                  if tag in ("td","th") and self.cell is not None:
                      self.row.append(" ".join(self.cell.split())); self.cell=None
                  elif tag=="tr" and self.row is not None:
                      if self.row: self.rows.append(self.row)
                      self.row=None
          p=Rows();p.feed(html)
          rows=[x for x in p.rows if any(x)]
          print("TABLE_ROWS",len(rows))
          for x in rows[:80]: print("CAMRY_ROW",json.dumps(x,ensure_ascii=False))
          open("out/camry-rows.json","w",encoding="utf-8").write(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-camry-catalog
          path: out/
          retention-days: 7
