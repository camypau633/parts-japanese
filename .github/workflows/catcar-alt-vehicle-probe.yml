name: CatCar alternate vehicle discovery
on:
  push:
    paths:
      - '.github/workflows/catcar-alt-vehicle-probe.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover Toyota model and modification links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          URL = "https://www.catcar.info/toyota/"
          req = urllib.request.Request(URL, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
              print("INDEX_HTTP", r.status, "BYTES", len(html))

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items=[]
                  self.current=None
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag == "a" and a.get("href"):
                      self.current={"href":a["href"],"text":""}
              def handle_data(self,data):
                  if self.current is not None:
                      self.current["text"] += data
              def handle_endtag(self,tag):
                  if tag=="a" and self.current is not None:
                      self.current["text"]=" ".join(self.current["text"].split())
                      self.items.append(self.current)
                      self.current=None

          p=Links(); p.feed(html)
          links=[]
          for x in p.items:
              href=urljoin(URL,x["href"])
              if "catcar.info/toyota" in href and x["text"]:
                  links.append({"text":x["text"][:120],"url":href})
          # Save only links that look like catalog/model navigation.
          unique=[]
          seen=set()
          for x in links:
              if x["url"] not in seen:
                  seen.add(x["url"]); unique.append(x)
          open("out/toyota-links.json","w",encoding="utf-8").write(json.dumps(unique,ensure_ascii=False,indent=2))
          print("LINK_COUNT",len(unique))
          for x in unique[:60]:
              print("CATALOG_LINK",json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-alternate-vehicle-discovery
          path: out/
          retention-days: 7
