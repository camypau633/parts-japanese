name: CatCar Camry diagram mapping probe
on:
  push:
    paths:
      - '.github/workflows/catcar-camry-diagram-probe.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect Camry oil-filter diagram and hotspot mapping
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import re
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import quote, urlsplit, urlunsplit

          BASE = "https://www.catcar.info"
          URL = "https://www.catcar.info/toyota/?%3D%3D"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, response.geturl(), response.read()

          status, final_url, raw = get(URL)
          html = raw.decode("utf-8", "replace")
          with open("out/camry-oil-filter.html", "w", encoding="utf-8") as output:
              output.write(html)
          print("GROUP_HTTP", status, "BYTES", len(raw), "URL", final_url)
          print("HOTSPOT_MARKERS", {key: html.count(key) for key in ["srcTop", "srcLeft", "srcWidth", "srcHeight", "hotspot", "area", "map"]})

          class ImageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []

              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      attrs = dict(attrs)
                      src = attrs.get("src") or attrs.get("data-src")
                      if src and any(ext in src.lower() for ext in [".png", ".jpg", ".gif"]):
                          if "ajax-loader" not in src and "/loader" not in src and "logo" not in src:
                              self.images.append(src)

          parser = ImageParser()
          parser.feed(html)
          for index, src in enumerate(dict.fromkeys(parser.images)):
              full_url = src if src.startswith("http") else BASE + src
              parts = urlsplit(full_url)
              full_url = urlunsplit((parts.scheme, parts.netloc, quote(parts.path, safe="/:._-"), parts.query, parts.fragment))
              try:
                  image_status, image_url, data = get(full_url)
                  filename = "out/diagram-%02d.bin" % index
                  with open(filename, "wb") as output:
                      output.write(data)
                  print("IMAGE", image_status, len(data), image_url, "SAVED", filename)
              except Exception as error:
                  print("IMAGE_ERROR", full_url, repr(error))

          for key in ["srcTop", "srcLeft", "srcWidth", "srcHeight"]:
              position = 0
              count = 0
              while True:
                  position = html.find(key, position)
                  if position < 0 or count >= 8:
                      break
                  context = html[max(0, position - 100):position + 180]
                  print("HOTSPOT_CONTEXT", context[:300].replace(chr(10), " "))
                  position += len(key)
                  count += 1

          for row in re.findall(r"<tr[^>]*>", html, re.I):
              if "getArticles" in row:
                  print("PART_ROW_TAG", row[:500])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-camry-diagram-mapping
          path: out/
          retention-days: 7
