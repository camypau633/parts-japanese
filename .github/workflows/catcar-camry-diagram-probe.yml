name: CatCar Camry diagram mapping probe
on:
  push:
    paths:
      - '.github/workflows/catcar-camry-diagram-probe.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect Camry oil-filter diagram and hotspot mapping
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import re, urllib.request
          from html.parser import HTMLParser
          from html import unescape
          BASE="https://www.catcar.info"
          URL="https://www.catcar.info/toyota/?%3D%3D"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r: return r.status,r.geturl(),r.read()
          status,final,raw=get(URL)
          html=raw.decode("utf-8","replace")
          open("out/camry-oil-filter.html","w",encoding="utf-8").write(html)
          print("GROUP_HTTP",status,"BYTES",len(raw),"URL",final)
          print("HOTSPOT_MARKERS", {k:html.count(k) for k in ["srcTop","srcLeft","srcWidth","srcHeight","hotspot","area","map"]})
          import os
          from html.parser import HTMLParser
          class ImgParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.images=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="img":
                      a=dict(attrs)
                      src=a.get("src") or a.get("data-src")
                      if src and any(ext in src.lower() for ext in [".png",".jpg",".gif"]):
                          self.images.append(src)
          parser=ImgParser(); parser.feed(html)
          for idx,src in enumerate(dict.fromkeys(parser.images)):
              full=src if src.startswith("http") else BASE+src
              try:
                  st,u,data=get(full)
                  name="out/diagram-%02d.bin"%idx
                  open(name,"wb").write(data)
                  print("IMAGE",st,len(data),u,"SAVED",name)
              except Exception as e: print("IMAGE_ERROR",full,repr(e))
          for key in ["srcTop","srcLeft","srcWidth","srcHeight"]:
              vals=[]
              pos=0
              while True:
                  pos=html.find(key,pos)
                  if pos<0: break
                  vals.append(html[max(0,pos-100):pos+180].replace("\\n"," "))
                  pos+=len(key)
              for v in vals[:8]: print("HOTSPOT_CONTEXT",v[:300])
          for row in re.findall(r"<tr[^>]*>",html,re.I):
              if "getArticles" in row: print("PART_ROW_TAG",row[:500])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-camry-diagram-mapping
          path: out/
          retention-days: 7
