name: CatCar Camry diagram mapping probe
on:
  push:
    paths:
      - '.github/workflows/catcar-camry-diagram-probe.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect Camry oil-filter diagram and expand both part rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          import re
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import quote, urlsplit, urlunsplit

          BASE = "https://www.catcar.info"
          URL = "https://www.catcar.info/toyota/?%3D%3D"

          def get(url):
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "X-Requested-With": "XMLHttpRequest"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, response.geturl(), response.read()

          class PartsParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      attrs = dict(attrs)
                      onclick = attrs.get("onclick", "")
                      name = attrs.get("name", "")
                      marker = "getArticles(this, '"
                      match = None
                      if marker in onclick:
                          token = onclick.split(marker, 1)[1].split("'", 1)[0]
                          match = (token,)
                      if name and match:
                          self.rows.append((name, token, onclick))

          status, final_url, raw = get(URL)
          html = raw.decode("utf-8", "replace")
          open("out/camry-oil-filter.html", "w", encoding="utf-8").write(html)
          print("GROUP_HTTP", status, "BYTES", len(raw), "AJAX_PROBE_VERSION", 2)
          parser = PartsParser()
          parser.feed(html)
          print("PART_ROWS_FOUND", len(parser.rows))

          class DiagramParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hotspots = []
                  self.images = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "div" and "coord" in attrs.get("class", "").split():
                      self.hotspots.append({
                          "part_number": attrs.get("srcnum") or attrs.get("name"),
                          "top": int(attrs["srctop"]) if attrs.get("srctop", "").isdigit() else None,
                          "left": int(attrs["srcleft"]) if attrs.get("srcleft", "").isdigit() else None,
                          "width": int(attrs["srcwidth"]) if attrs.get("srcwidth", "").isdigit() else None,
                          "height": int(attrs["srcheight"]) if attrs.get("srcheight", "").isdigit() else None
                      })
                  if tag == "img" and attrs.get("src"):
                      self.images.append(attrs["src"])

          diagram_parser = DiagramParser()
          diagram_parser.feed(html)
          diagram_images = [src for src in diagram_parser.images if any(ext in src.lower() for ext in (".png", ".jpg", ".jpeg"))]
          parts_output = {}

          for name, token, onclick in parser.rows:
              ajax_url = BASE + "/toyota/?l=" + quote(token, safe="") + "&st=81"
              try:
                  ajax_status, response_url, data = get(ajax_url)
                  body = data.decode("utf-8", "replace")
                  filename = "out/part-" + re.sub(r"[^A-Za-z0-9_-]", "_", name) + ".html"
                  open(filename, "w", encoding="utf-8").write(body)
                  class CellParser(HTMLParser):
                      def __init__(self):
                          super().__init__()
                          self.rows = []
                          self.current = None
                          self.in_cell = False
                      def handle_starttag(self, tag, attrs):
                          if tag == "tr":
                              self.current = []
                          elif tag == "td" and self.current is not None:
                              self.in_cell = True
                      def handle_endtag(self, tag):
                          if tag == "td":
                              self.in_cell = False
                          elif tag == "tr" and self.current is not None:
                              if self.current:
                                  self.rows.append(self.current)
                              self.current = None
                      def handle_data(self, value):
                          if self.in_cell and self.current is not None:
                              self.current.append(value.strip())
                  cells = CellParser()
                  cells.feed(body)
                  records = []
                  for row in cells.rows:
                      values = [value for value in row if value]
                      if len(values) >= 3:
                          records.append({"oem": values[0], "period": values[1], "applicability": values[2]})
                  parts_output[name] = {
                      "part_number": name,
                      "ajax_http_status": ajax_status,
                      "records": records
                  }
                  print("AJAX_RESULT", name, "HTTP", ajax_status, "BYTES", len(data), "FILE", filename)
                  print("CATALOG_RECORDS", name, records)
              except Exception as error:
                  print("AJAX_ERROR", name, repr(error))

          result = {
              "source": "CatCar.info",
              "vehicle": {
                  "make": "Toyota",
                  "model": "Camry",
                  "catalog_id": "284170",
                  "modification": "ACV30-AEPNK",
                  "engine": "2AZFE",
                  "modification_period": "09/2001-01/2006"
              },
              "group": {
                  "id": "15-02",
                  "name": "ФИЛЬТР МАСЛЯНЫЙ"
              },
              "diagram": {
                  "image_candidates": diagram_images,
                  "hotspots": diagram_parser.hotspots
              },
              "parts": parts_output
          }
          with open("out/catalog_records.json", "w", encoding="utf-8") as output:
              json.dump(result, output, ensure_ascii=False, indent=2)
          print("STRUCTURED_JSON", "out/catalog_records.json",
                "PARTS", len(parts_output),
                "HOTSPOTS", len(diagram_parser.hotspots))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-camry-oil-filter-ajax
          path: out/
          retention-days: 7
