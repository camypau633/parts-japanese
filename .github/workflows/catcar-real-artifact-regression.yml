name: CatCar real artifact regression

on:
  push:
    paths:
      - 'tools/catcar_poc/validate_real_artifacts.py'
      - 'tools/catcar_poc/export_partscope.py'
      - 'tools/catcar_poc/check_diagram_urls.py'
      - 'tools/catcar_poc/inspect_diagram_geometry.py'
      - 'tools/catcar_poc/adapters.py'
      - 'tools/catcar_poc/normalize.py'
      - 'tools/catcar_poc/parser.py'
      - 'tools/catcar_poc/tests/test_export_partscope.py'
      - 'schemas/catcar-extraction-v0.1.schema.json'
      - '.github/workflows/catcar-real-artifact-regression.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download bounded Japanese CatCar fixtures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .catcar-fixtures/{toyota-group,nissan,camry}
          download_artifact() {
            artifact_id="$1"
            destination="$2"
            archive="$(mktemp)"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$archive"
            unzip -q "$archive" -d "$destination"
            rm -f "$archive"
          }
          download_artifact 13143620621 .catcar-fixtures/toyota-group
          download_artifact 13144167306 .catcar-fixtures/nissan
          download_artifact 13155555091 .catcar-fixtures/camry
          test -s .catcar-fixtures/camry/normalized/report.json
          test -s .catcar-fixtures/camry/diagram-geometry.json
      - name: Inspect CatCar Toyota getArticles transport
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            'https://www.catcar.info/js/script.js?v=2.0' -o /tmp/catcar-script.js
          python - <<'PY'
          from pathlib import Path
          source = Path("/tmp/catcar-script.js").read_text(encoding="utf-8", errors="replace")
          marker = "function getArticles"
          start = source.find(marker)
          if start < 0:
              marker = "getArticles = function"
              start = source.find(marker)
          if start < 0:
              raise SystemExit("CatCar getArticles function was not found in script.js")
          brace = source.find("{", start)
          if brace < 0:
              raise SystemExit("CatCar getArticles function has no body")
          depth = 0
          quote = None
          escaped = False
          end = None
          for index in range(brace, len(source)):
              char = source[index]
              if quote:
                  if escaped:
                      escaped = False
                  elif char == "\\\\":
                      escaped = True
                  elif char == quote:
                      quote = None
                  continue
              if char in ("'", '"', "`"):
                  quote = char
              elif char == "{":
                  depth += 1
              elif char == "}":
                  depth -= 1
                  if depth == 0:
                      end = index + 1
                      break
          if end is None:
              raise SystemExit("Could not isolate getArticles function")
          print("CATCAR_GETARTICLES_SOURCE_BEGIN")
          print(source[start:end])
          print("CATCAR_GETARTICLES_SOURCE_END")
          PY
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Parse captured Toyota and Nissan HTML fixtures
        run: |
          python -m tools.catcar_poc.validate_real_artifacts \
            --root .catcar-fixtures \
            --schema schemas/catcar-extraction-v0.1.schema.json \
            --output out/normalized
      - name: Build bounded list of Japanese diagrams
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --input out/normalized/toyota-camry-oil-filter.json
            --input out/normalized/nissan-pixo.json
          )
          for file in .catcar-fixtures/camry/normalized/toyota-camry-group-*.json; do
            args+=(--input "$file")
          done
          python -m tools.catcar_poc.check_diagram_urls "${args[@]}" \
            --output out/diagram-url-check.json --max-urls 20 --timeout 10
      - name: Verify Japanese diagram dimensions and hotspot coordinate system
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --input out/normalized/toyota-camry-oil-filter.json
            --input out/normalized/nissan-pixo.json
          )
          for file in .catcar-fixtures/camry/normalized/toyota-camry-group-*.json; do
            args+=(--input "$file")
          done
          python -m tools.catcar_poc.inspect_diagram_geometry "${args[@]}" \
            --output out/diagram-geometry.json --max-urls 20 --timeout 12
          cat out/diagram-geometry.json
      - name: Confirm Toyota AJAX pages remain blocked until lookup is implemented
        run: |
          python - <<'PY'
          import json
          with open("out/normalized/toyota-camry-oil-filter.json", encoding="utf-8") as stream:
              document = json.load(stream)
          validation = document["validation"]
          assert validation["page_status"] == "incomplete", validation
          assert "toyota_ajax_lookup_not_implemented" in validation["page_warnings"], validation
          assert any(row.get("source_status") == "requires_ajax" for row in document["parts"])
          print("Toyota fixture correctly withheld from export pending AJAX lookup.")
          PY
      - name: Export verified Nissan fixture to isolated PartScope preview shards
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.catcar_poc.export_partscope \
            --input out/normalized/nissan-pixo.json \
            --output out/partscope --geometry-report out/diagram-geometry.json
          cat out/partscope/export-report.json
      - name: Require verified Nissan records and hotspots
        run: |
          python - <<'PY'
          import json
          with open("out/partscope/export-report.json", encoding="utf-8") as stream:
              report = json.load(stream)
          validation = report["validation"]
          assert set(validation["records_by_brand"]) == {"Nissan"}, validation["records_by_brand"]
          assert validation["records_by_brand"]["Nissan"] > 0
          assert validation["records_with_compatibility_years"] == report["records_exported"]
          assert validation["hotspots_validated"] > 0
          assert validation["records_with_hotspots"] > 0
          print("Verified Nissan records:", validation["records_by_brand"])
          print("Verified hotspots:", validation["hotspots_validated"])
          print("Records with hotspots:", validation["records_with_hotspots"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-real-artifact-regression
          path: out/
          retention-days: 7
