name: CatCar real artifact regression
on:
  push:
    paths:
      - 'tools/catcar_poc/validate_real_artifacts.py'
      - 'tools/catcar_poc/export_partscope.py'
      - 'tools/catcar_poc/check_diagram_urls.py'
      - 'tools/catcar_poc/adapters.py'
      - 'tools/catcar_poc/normalize.py'
      - 'tools/catcar_poc/parser.py'
      - 'schemas/catcar-extraction-v0.1.schema.json'
      - '.github/workflows/catcar-real-artifact-regression.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download previously captured probe artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .catcar-fixtures/{toyota-group,nissan,ford,vag}
          download_artifact() {
            artifact_id="$1"
            destination="$2"
            archive="$(mktemp)"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$archive"
            unzip -q "$archive" -d "$destination"
            rm -f "$archive"
          }
          download_artifact 13143620621 .catcar-fixtures/toyota-group
          download_artifact 13144167306 .catcar-fixtures/nissan
          download_artifact 13144338363 .catcar-fixtures/ford
          download_artifact 13144454095 .catcar-fixtures/vag
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Parse real captured HTML and validate normalized JSON
        run: |
          python -m tools.catcar_poc.validate_real_artifacts \
            --root .catcar-fixtures \
            --schema schemas/catcar-extraction-v0.1.schema.json \
            --output out/normalized
      - name: Probe confirmed CatCar diagram URLs (bounded, no full downloads)
        run: |
          python -m tools.catcar_poc.check_diagram_urls \
            --input out/normalized/toyota-camry-oil-filter.json \\
            --input out/normalized/nissan-pixo.json \\
            --output out/diagram-url-check.json \\
            --max-urls 20 --timeout 10
      - name: Export Toyota and Nissan fixtures to PartScope shards
        run: python -m tools.catcar_poc.export_partscope --input out/normalized/toyota-camry-oil-filter.json --input out/normalized/nissan-pixo.json --output out/partscope
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-real-artifact-regression
          path: out/
          retention-days: 7
