name: CatCar real artifact regression

on:
  push:
    paths:
      - 'tools/catcar_poc/validate_real_artifacts.py'
      - 'tools/catcar_poc/export_partscope.py'
      - 'tools/catcar_poc/check_diagram_urls.py'
      - 'tools/catcar_poc/inspect_diagram_geometry.py'
      - 'tools/catcar_poc/adapters.py'
      - 'tools/catcar_poc/normalize.py'
      - 'tools/catcar_poc/parser.py'
      - 'tools/catcar_poc/tests/test_export_partscope.py'
      - 'schemas/catcar-extraction-v0.1.schema.json'
      - '.github/workflows/catcar-real-artifact-regression.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download bounded Japanese CatCar fixtures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .catcar-fixtures/{toyota-group,nissan,camry}
          download_artifact() {
            artifact_id="$1"
            destination="$2"
            archive="$(mktemp)"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$archive"
            unzip -q "$archive" -d "$destination"
            rm -f "$archive"
          }
          download_artifact 13143620621 .catcar-fixtures/toyota-group
          download_artifact 13144167306 .catcar-fixtures/nissan
          download_artifact 13155555091 .catcar-fixtures/camry
          test -s .catcar-fixtures/camry/normalized/report.json
          test -s .catcar-fixtures/camry/diagram-geometry.json
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Verify three captured Toyota AJAX URLs against live CatCar
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from tools.catcar_poc.crawl_catalog import fetch_toyota_ajax_page
          from tools.catcar_poc.adapters import ToyotaAdapter

          sample = json.loads(Path(".catcar-fixtures/camry/oem_variation_sample.json").read_text(encoding="utf-8"))
          checked = 0
          for group in sample.get("sampled_groups", []):
              for part in group.get("parts", []):
                  if part.get("source_status") != "available":
                      continue
                  url = part.get("ajax_url", "")
                  status, final_url, html = fetch_toyota_ajax_page(url, 30)
                  if status != 200:
                      raise SystemExit("Toyota AJAX HTTP status: %s" % status)
                  records = ToyotaAdapter.parse_ajax_records(html, part.get("part_number"))
                  expected = [str(row.get("oem") or "").strip() for row in part.get("records", [])]
                  actual = [row.get("oem_number_raw") or "" for row in records]
                  if not records or actual != expected:
                      raise SystemExit("Live Toyota AJAX mismatch for %s: %r != %r" % (part.get("part_number"), actual, expected))
                  checked += 1
                  print("Live Toyota AJAX verified:", part.get("part_number"), "OEM rows:", len(records))
                  if checked >= 3:
                      break
                  time.sleep(2)
              if checked >= 3:
                  break
          if checked != 3:
              raise SystemExit("Expected 3 live Toyota AJAX checks; completed %s" % checked)
          PY
      - name: Live smoke-test the implemented Toyota AJAX fetcher
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit
          from tools.catcar_poc.crawl_catalog import build_toyota_ajax_url, fetch_toyota_ajax_page
          from tools.catcar_poc.adapters import ToyotaAdapter
          sample = json.loads(Path(".catcar-fixtures/camry/oem_variation_sample.json").read_text(encoding="utf-8"))
          part = next(
              part
              for group in sample["sampled_groups"]
              for part in group.get("parts", [])
              if part.get("source_status") == "available"
          )
          token = parse_qs(urlsplit(part["ajax_url"]).query)["l"][0]
          url = build_toyota_ajax_url(token)
          status, final_url, html = fetch_toyota_ajax_page(url, 30)
          assert status == 200, status
          actual = ToyotaAdapter.parse_ajax_records(html, part["part_number"])
          expected = [
              (row.get("oem"), row.get("period"), row.get("applicability"))
              for row in part.get("records", [])
          ]
          observed = [
              (row.get("oem_number_raw"), row.get("production_period_raw"), row.get("applicability_raw"))
              for row in actual
          ]
          assert observed == expected, {"expected": expected, "observed": observed, "url": final_url}
          print("Live Toyota AJAX fetch verified:", part["part_number"], "records:", len(actual))
          PY
      - name: Live end-to-end crawl one Toyota Camry group
        run: |
          python - <<'PY'
          import glob
          import json
          import subprocess
          import sys
          from pathlib import Path
          sample = json.loads(Path(".catcar-fixtures/camry/oem_variation_sample.json").read_text(encoding="utf-8"))
          group = next(item for item in sample["sampled_groups"] if item.get("group_id") == "1103")
          output = Path("out/toyota-live-crawl")
          subprocess.run([
              sys.executable, "-m", "tools.catcar_poc.crawl_catalog",
              "--make", "toyota", "--start-url", group["url"],
              "--output", str(output), "--max-pages", "1",
              "--delay", "10", "--timeout", "30",
          ], check=True)
          report = json.loads((output / "crawl-report.json").read_text(encoding="utf-8"))
          documents = glob.glob(str(output / "normalized" / "*.json"))
          assert report["fetch_errors"] == 0, report
          assert report["incomplete_detail_pages"] == 0, report
          assert report["retry_urls_pending"] == 0, report
          assert report["detail_pages_normalized"] == 1, report
          assert report["queue_remaining"] > 0, report
          assert len(documents) == 1, documents
          document = json.loads(Path(documents[0]).read_text(encoding="utf-8"))
          assert document["validation"]["page_status"] == "complete", document["validation"]
          assert len(document["parts"]) == 2, len(document["parts"])
          assert len(document["oem_records"]) > 0, document["oem_records"]
          assert len(list((output / "ajax_raw").glob("*.html"))) == 2
          print("Live Toyota group:", group["group_id"])
          print("Rows:", len(document["parts"]))
          print("OEM records:", len(document["oem_records"]))
          print("Saved raw AJAX responses:", len(list((output / "ajax_raw").glob("*.html"))))
          PY
      - name: Parse captured Toyota and Nissan HTML fixtures
        run: |
          python -m tools.catcar_poc.validate_real_artifacts \
            --root .catcar-fixtures \
            --schema schemas/catcar-extraction-v0.1.schema.json \
            --output out/normalized
      - name: Replay captured Toyota getArticles responses across eight groups
        run: |
          python -m tools.catcar_poc.normalize_toyota_oem_sample \
            --sample .catcar-fixtures/camry/oem_variation_sample.json \
            --schema schemas/catcar-extraction-v0.1.schema.json \
            --output out/toyota-oem-variation
          python - <<'PY'
          import json
          with open("out/toyota-oem-variation/report.json", encoding="utf-8") as stream:
              report = json.load(stream)
          assert report["group_count"] == 8, report
          assert report["part_row_count"] == 123, report
          assert report["sampled_part_row_count"] == 123, report
          assert report["unsampled_part_row_count"] == 0, report
          assert report["oem_record_count"] == 330, report
          assert report["unique_oem_number_count"] == 183, report
          assert report["diagram_count"] == 8, report
          assert report["schema_valid"] is True, report
          print("Captured Toyota groups:", report["group_count"])
          print("Toyota rows resolved by AJAX:", report["sampled_part_row_count"])
          print("OEM records:", report["oem_record_count"])
          print("Unique OEM numbers:", report["unique_oem_number_count"])
          PY
      - name: Build bounded list of Japanese diagrams
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --input out/normalized/toyota-camry-oil-filter.json
            --input out/normalized/nissan-pixo.json
          )
          for file in out/toyota-oem-variation/toyota-camry-group-*.json; do
            args+=(--input "$file")
          done
          python -m tools.catcar_poc.check_diagram_urls "${args[@]}" \
            --output out/diagram-url-check.json --max-urls 20 --timeout 10
      - name: Verify Japanese diagram dimensions and hotspot coordinate system
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --input out/normalized/toyota-camry-oil-filter.json
            --input out/normalized/nissan-pixo.json
          )
          for file in out/toyota-oem-variation/toyota-camry-group-*.json; do
            args+=(--input "$file")
          done
          python -m tools.catcar_poc.inspect_diagram_geometry "${args[@]}" \
            --output out/diagram-geometry.json --max-urls 20 --timeout 12
          cat out/diagram-geometry.json
      - name: Require fully resolved Toyota AJAX rows before export
        run: |
          python - <<'PY'
          import glob
          import json
          paths = sorted(glob.glob("out/toyota-oem-variation/toyota-camry-group-*.json"))
          assert len(paths) == 8, paths
          total_rows = 0
          total_oem = 0
          for path in paths:
              with open(path, encoding="utf-8") as stream:
                  document = json.load(stream)
              validation = document["validation"]
              assert validation["page_status"] == "complete", (path, validation)
              for part in document["parts"]:
                  status = part.get("additional_source_fields", {}).get("ajax_sample_status")
                  assert status in ("available", "no_applicable_data"), (path, part)
              total_rows += len(document["parts"])
              total_oem += len(document["oem_records"])
          assert total_rows == 123, total_rows
          assert total_oem == 330, total_oem
          print("Complete Toyota groups:", len(paths))
          print("Resolved Toyota part rows:", total_rows)
          print("Preserved OEM records:", total_oem)
          PY
      - name: Export verified Toyota and Nissan fixtures to isolated PartScope preview shards
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --input out/normalized/nissan-pixo.json
          )
          for file in out/toyota-oem-variation/toyota-camry-group-*.json; do
            args+=(--input "$file")
          done
          python -m tools.catcar_poc.export_partscope "${args[@]}" \
            --output out/partscope --geometry-report out/diagram-geometry.json
          cat out/partscope/export-report.json
      - name: Require verified Toyota and Nissan records and hotspots
        run: |
          python - <<'PY'
          import json
          with open("out/partscope/export-report.json", encoding="utf-8") as stream:
              report = json.load(stream)
          validation = report["validation"]
          assert set(validation["records_by_brand"]) == {"Toyota", "Nissan"}, validation["records_by_brand"]
          assert validation["records_by_brand"]["Toyota"] > 0
          assert validation["records_by_brand"]["Nissan"] > 0
          assert validation["records_with_compatibility_years"] == report["records_exported"]
          assert validation["hotspots_validated"] > 0
          assert validation["records_with_hotspots"] > 0
          print("Verified Japanese records:", validation["records_by_brand"])
          print("Verified hotspots:", validation["hotspots_validated"])
          print("Records with hotspots:", validation["records_with_hotspots"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-real-artifact-regression
          path: out/
          retention-days: 7
