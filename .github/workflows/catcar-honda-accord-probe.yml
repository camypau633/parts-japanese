name: CatCar Honda Accord model probe

on:
  push:
    paths:
      - '.github/workflows/catcar-honda-accord-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect one Honda Accord catalog page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sleep 10
          python - <<'PY'
          import json
          import re
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit

          URL = "https://www.catcar.info/honda/?l=bW9kbmFtZT09QUNDT1JEfHxkb29ycz09NHx8eWVhcj09MjAxMXx8c3Q9PTMwfHxzdHM9PXsiMjAiOiJcdTA0MTVcdTA0MzJcdTA0NDBcdTA0M2VcdTA0M2ZcdTA0MzAiLCIzMCI6IjIwMTEgQUNDT1JEIn0%3D"
          req=urllib.request.Request(URL,headers={"User-Agent":"PartScope-Japanese-Catalog-Discovery/1.0","Accept":"text/html,application/xhtml+xml"})
          with urllib.request.urlopen(req,timeout=30) as response:
              status,final_url=response.status,response.geturl()
              body=response.read(4*1024*1024+1)
          if len(body)>4*1024*1024: raise SystemExit("Honda page exceeded 4 MiB limit")
          html=body.decode("utf-8","replace")
          open("out/honda-accord-model.html","w",encoding="utf-8").write(html)

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows=[]; self.row=None; self.cell=None
                  self.links=[]; self.current_link=None
                  self.title=False; self.title_text=[]
                  self.breadcrumb=False; self.breadcrumb_text=[]
                  self.images=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="title": self.title=True
                  elif tag=="tr": self.row=[]
                  elif tag in ("td","th") and self.row is not None: self.cell=[]
                  elif tag=="a" and a.get("href"):
                      self.current_link={"href":a["href"],"text":""}; self.links.append(self.current_link)
                  elif tag=="img" and (a.get("src") or a.get("data-src")):
                      self.images.append(a.get("src") or a.get("data-src"))
                  elif tag=="script": self.scripts.append(a.get("src","inline"))
                  if tag=="ul" and "breadcrumbs" in a.get("class","").split(): self.breadcrumb=True
              def handle_data(self,data):
                  if self.title: self.title_text.append(data.strip())
                  if self.cell is not None: self.cell.append(data.strip())
                  if self.current_link is not None: self.current_link["text"]+=data.strip()
                  if self.breadcrumb: self.breadcrumb_text.append(data.strip())
              def handle_endtag(self,tag):
                  if tag=="title": self.title=False
                  elif tag in ("td","th") and self.cell is not None and self.row is not None:
                      self.row.append(" ".join(" ".join(self.cell).split())); self.cell=None
                  elif tag=="tr" and self.row is not None:
                      if any(self.row): self.rows.append(self.row)
                      self.row=None; self.cell=None
                  elif tag=="a": self.current_link=None
                  elif tag=="ul" and self.breadcrumb: self.breadcrumb=False

          p=Page(); p.feed(html)
          links=[]
          for x in p.links:
              target=urljoin(final_url,x["href"])
              host=(urlsplit(target).hostname or "").lower()
              if host=="catcar.info" or host.endswith(".catcar.info"):
                  links.append({"text":" ".join(x["text"].split()),"url":target})
          result={
              "make":"Honda","model":"Accord","year":"2011","body":"4-door",
              "http_status":status,"final_url":final_url,"bytes":len(body),
              "title":" ".join(x for x in p.title_text if x),
              "breadcrumbs":" ".join(x for x in p.breadcrumb_text if x),
              "table_rows":p.rows[:50],"table_row_count":len(p.rows),
              "catalog_links":links[:100],"images":p.images[:80],"scripts":p.scripts[:80],
              "markers":{k:html.count(k) for k in ("srcNum","srcTop","srcLeft","getArticles","groups-parts__item")}
          }
          open("out/honda-accord-inspection.json","w",encoding="utf-8").write(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if status!=200: raise SystemExit("Honda Accord page did not return HTTP 200")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-honda-accord-inspection
          path: out/
          retention-days: 7
