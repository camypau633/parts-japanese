name: CatCar Ford detail-page probe
on:
  push:
    paths:
      - '.github/workflows/catcar-ford-detail-probe.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Follow Ford group and inspect parts diagram
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, re, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, parse_qs
          import base64

          START = "https://www.catcar.info/ford/?%3D&lang=en"

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Chrome/128 Safari/537.36","Accept-Language":"en-US,en;q=0.9"})
              with urllib.request.urlopen(req,timeout=40) as r: return r.status,r.geturl(),r.read()

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rows=[]; self.row=None; self.cell=None; self.images=[]; self.links=[]; self.scripts=[]; self.coords=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=="tr": self.row=[]
                  elif t in ("td","th") and self.row is not None: self.cell=[]
                  elif t=="img" and (a.get("src") or a.get("data-src")): self.images.append(a)
                  elif t=="a" and a.get("href"): self.links.append({"href":a["href"],"class":a.get("class","")})
                  elif t=="script": self.scripts.append(a.get("src","inline"))
                  elif t=="div" and "coord" in a.get("class","").split(): self.coords.append(a)
              def handle_data(self,d):
                  if self.cell is not None: self.cell.append(d.strip())
              def handle_endtag(self,t):
                  if t in ("td","th") and self.row is not None and self.cell is not None:
                      self.row.append(" ".join(" ".join(self.cell).split())); self.cell=None
                  elif t=="tr" and self.row is not None:
                      if any(self.row): self.rows.append(self.row)
                      self.row=None; self.cell=None

          st,final,body=get(START); first=body.decode("utf-8","replace")
          p0=P(); p0.feed(first)
          group_links=[x["href"] for x in p0.links if "groups-parts__item" in x["class"]]
          if not group_links: raise RuntimeError("No Ford groups-parts__item links found")
          # Pick A04 (dash/apron/heater/windscreen) as a representative body subgroup.
          def decoded_link(link):
              try:
                  token=parse_qs(urlparse(link).query).get("l",[""])[0]
                  return base64.b64decode(token + "="*((4-len(token)%4)%4)).decode("utf-8","replace")
              except Exception: return ""
          target=next((urljoin(final,x) for x in group_links if "group==A04" in decoded_link(x)),urljoin(final,group_links[0]))
          st2,final2,body2=get(target); html2=body2.decode("utf-8","replace")
          p2=P(); p2.feed(html2)
          subgroup_links=p2.links
          leaf=next((x["href"] for x in subgroup_links if "sect==A04041" in decoded_link(x["href"])),None)
          if leaf:
              detail_target=urljoin(final2,leaf)
              st3,final3,body3=get(detail_target); html=body3.decode("utf-8","replace")
          else:
              detail_target=target; st3,final3,body3=st2,final2,body2; html=html2
          open("out/ford-fiesta-detail.html","w",encoding="utf-8").write(html)
          p=P(); p.feed(html)
          markers=["srcTop","srcLeft","srcWidth","srcHeight","srcNum","coord","groups-parts__item","getArticles"]
          row_ids=sorted(set(row[0].strip() for row in p.rows[1:] if row and row[0].strip()))
          coord_ids=sorted(set(x.get("name","").strip() for x in p.coords if x.get("name","").strip()))
          result={"start_http":st,"start_url":final,"group_links":len(group_links),"selected_group_url":target,
                  "subgroup_links":len(subgroup_links),"selected_leaf_url":detail_target,
                  "detail_http":st3,"detail_url":final3,"detail_bytes":len(body3),
                  "table_rows":len(p.rows),"sample_rows":p.rows[:25],"images":p.images[:50],
                  "links":p.links[:50],"scripts":p.scripts[:30],
                  "markers":{x:html.count(x) for x in markers},"coord_divs":p.coords[:100],
                  "table_part_codes":row_ids,"hotspot_ids":coord_ids,
                  "matched_hotspot_ids":sorted(set(row_ids)&set(coord_ids)),
                  "unmatched_hotspot_ids":sorted(set(coord_ids)-set(row_ids)),
                  "table_codes_without_hotspot":sorted(set(row_ids)-set(coord_ids))}
          print(json.dumps(result,ensure_ascii=False,indent=2))
          with open("out/ford-fiesta-detail.json","w",encoding="utf-8") as f: json.dump(result,f,ensure_ascii=False,indent=2)

          downloads=[]
          for img in p.images:
              src=img.get("src") or img.get("data-src") or ""
              if not src or "logo" in src.lower() or src.startswith("data:"): continue
              u=urljoin(final2,src)
              try:
                  s,fu,b=get(u); fn="out/ford-diagram-%02d.bin"%len(downloads); open(fn,"wb").write(b)
                  downloads.append({"url":fu,"http":s,"bytes":len(b),"file":fn})
              except Exception as e: downloads.append({"url":u,"error":repr(e)})
              if len(downloads)>=6: break
          print("DIAGRAM_DOWNLOADS",json.dumps(downloads,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-ford-detail-inspection
          path: out/
          retention-days: 7
