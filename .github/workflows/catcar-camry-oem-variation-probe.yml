name: CatCar Camry OEM variation probe
on:
  push:
    paths:
      - '.github/workflows/catcar-camry-oem-variation-probe.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Sample Camry groups and part catalog records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import quote, urljoin

          BASE = "https://www.catcar.info"
          MOD_URL = "https://www.catcar.info/toyota/?"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "X-Requested-With": "XMLHttpRequest"})
              last_error = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=40) as response:
                          return response.status, response.geturl(), response.read()
                  except urllib.error.HTTPError as error:
                      last_error = error
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                  except (urllib.error.URLError, TimeoutError) as error:
                      last_error = error
                      if attempt == 2:
                          raise
                  time.sleep(2 * (attempt + 1))
              raise last_error

          class GroupParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.groups = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      a = dict(attrs)
                      if "groups-parts__item" in a.get("class", "").split() and a.get("href"):
                          self.groups.append({"href": a["href"], "label": a.get("title") or a.get("aria-label") or ""})

          class PartParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      a = dict(attrs)
                      onclick = a.get("onclick", "")
                      marker = "getArticles(this, '"
                      if a.get("name") and marker in onclick:
                          token = onclick.split(marker, 1)[1].split("'", 1)[0]
                          self.rows.append({"part_number": a["name"], "token": token})

          class CellParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
                  self.current = None
                  self.cell = None
              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.current = []
                  elif tag in ("td", "th") and self.current is not None:
                      self.cell = []
              def handle_endtag(self, tag):
                  if tag in ("td", "th") and self.current is not None and self.cell is not None:
                      self.current.append(" ".join(" ".join(self.cell).split()))
                      self.cell = None
                  elif tag == "tr" and self.current is not None:
                      if self.current:
                          self.rows.append(self.current)
                      self.current = None
                      self.cell = None
              def handle_data(self, value):
                  if self.cell is not None:
                      self.cell.append(value.strip())

          status, final_url, body = get(MOD_URL)
          open("out/camry-modification.html", "wb").write(body)
          groups = GroupParser()
          groups.feed(body.decode("utf-8", "replace"))
          unique_groups = []
          seen = set()
          for g in groups.groups:
              url = urljoin(final_url, g["href"])
              if url not in seen:
                  seen.add(url)
                  unique_groups.append({"url": url, "label": g["label"]})
          print("MODIFICATION_HTTP", status, "GROUPS_FOUND", len(unique_groups))

          output = {"vehicle": {"make": "Toyota", "model": "Camry", "catalog_id": "284170", "modification": "ACV30-AEPNK", "engine": "2AZFE"}, "sampled_groups": []}
          sampled = 0
          sampled_parts = 0
          for group in unique_groups[:8]:
              try:
                  gs, gu, gb = get(group["url"])
                  gp = PartParser()
                  gp.feed(gb.decode("utf-8", "replace"))
                  group_result = {"url": gu, "http": gs, "parts": []}
                  for part in gp.rows[:6]:
                      if sampled_parts >= 40:
                          break
                      sampled_parts += 1
                      try:
                          au = BASE + "/toyota/?l=" + quote(part["token"], safe="") + "&st=81"
                          ast, af, ab = get(au)
                          raw_name = "out/part-" + re.sub(r"[^A-Za-z0-9_-]", "_", part["part_number"]) + ".html"
                          open(raw_name, "wb").write(ab)
                          cp = CellParser()
                          cp.feed(ab.decode("utf-8", "replace"))
                          records = []
                          for row in cp.rows:
                              values = [v.strip() for v in row]
                              if len(values) >= 3 and any(values):
                                  records.append({"oem": values[0], "period": values[1], "applicability": values[2]})
                          part_result = {"part_number": part["part_number"], "ajax_http": ast, "records": records}
                          group_result["parts"].append(part_result)
                          print("SAMPLED_PART", part["part_number"], "RECORDS", len(records), "UNIQUE_OEM", len(set(x["oem"] for x in records)))
                      except Exception as e:
                          group_result["parts"].append({"part_number": part["part_number"], "error": repr(e)})
                  output["sampled_groups"].append(group_result)
                  sampled += 1
                  print("GROUP_SAMPLE", sampled, "HTTP", gs, "ROWS", len(gp.rows))
                  if sampled_parts >= 40:
                      break
              except Exception as e:
                  print("GROUP_ERROR", group["url"], repr(e))

          def month_index(value):
              match = re.fullmatch(r"(\\d{2})/(\\d{4})", value.strip())
              if not match:
                  return None
              month, year = int(match.group(1)), int(match.group(2))
              if month < 1 or month > 12:
                  return None
              return year * 12 + month - 1

          overlap_cases = []
          sequential_cases = []
          unparsed_periods = []
          for group in output["sampled_groups"]:
              for part in group["parts"]:
                  records = part.get("records", [])
                  normalized = []
                  for record in records:
                      raw_period = record.get("period", "")
                      bits = raw_period.split("-", 1)
                      start = month_index(bits[0]) if bits else None
                      end = month_index(bits[1]) if len(bits) > 1 and bits[1].strip() else None
                      if start is None or (len(bits) > 1 and bits[1].strip() and end is None):
                          unparsed_periods.append({"part_number": part["part_number"], "record": record})
                          continue
                      normalized.append((record, start, end))

                  for i in range(len(normalized)):
                      left, ls, le = normalized[i]
                      for right, rs, re_ in normalized[i + 1:]:
                          left_end = le if le is not None else 10**9
                          right_end = re_ if re_ is not None else 10**9
                          if max(ls, rs) < min(left_end, right_end) and left.get("oem") != right.get("oem"):
                              overlap_cases.append({
                                  "part_number": part["part_number"],
                                  "left": left,
                                  "right": right,
                                  "same_applicability": left.get("applicability") == right.get("applicability")
                              })

                  by_oem = sorted(normalized, key=lambda x: (x[1], x[2] if x[2] is not None else 10**9, x[0].get("oem", "")))
                  for i in range(len(by_oem)):
                      left, ls, le = by_oem[i]
                      if le is None:
                          continue
                      for right, rs, re_ in by_oem[i + 1:]:
                          if rs == le and left.get("oem") != right.get("oem"):
                              sequential_cases.append({
                                  "part_number": part["part_number"],
                                  "previous": left,
                                  "next": right,
                                  "same_applicability": left.get("applicability") == right.get("applicability")
                              })

          output["temporal_analysis"] = {
              "different_oem_overlapping_periods": overlap_cases,
              "different_oem_adjacent_periods": sequential_cases,
              "unparsed_periods": unparsed_periods
          }
          print("TEMPORAL_ANALYSIS",
                "OVERLAPS", len(overlap_cases),
                "ADJACENT_OEM_CHANGES", len(sequential_cases),
                "UNPARSED_PERIODS", len(unparsed_periods))
          for item in overlap_cases[:15]:
              print("OEM_OVERLAP", item["part_number"],
                    item["left"]["oem"], item["left"]["period"],
                    "<>", item["right"]["oem"], item["right"]["period"],
                    "SAME_APPLICABILITY", item["same_applicability"])
          for item in sequential_cases[:15]:
              print("OEM_ADJACENT", item["part_number"],
                    item["previous"]["oem"], item["previous"]["period"],
                    "->", item["next"]["oem"], item["next"]["period"],
                    "SAME_APPLICABILITY", item["same_applicability"])

          with open("out/oem_variation_sample.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print("SAMPLE_COMPLETE", "GROUPS", sampled, "PARTS", sampled_parts)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-camry-oem-variation-sample
          path: out/
          retention-days: 7
