name: CatCar Japanese eight-catalog survey

on:
  workflow_dispatch:
    inputs:
      max_pages_per_catalog:
        description: "Maximum pages per catalog (1-100)"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: catcar-japanese-eight-catalog-survey
  cancel-in-progress: false

jobs:
  survey:
    name: Survey ${{ matrix.make }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Run independent catalogs concurrently, but cap pressure on CatCar.
      max-parallel: 2
      matrix:
        make: [toyota, nissan, honda, suzuki, mazda, mitsubishi, isuzu, subaru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate survey limit
        env:
          MAX_PAGES: ${{ inputs.max_pages_per_catalog }}
        run: |
          set -euo pipefail
          if ! [[ "$MAX_PAGES" =~ ^[0-9]+$ ]] || (( MAX_PAGES < 1 || MAX_PAGES > 100 )); then
            echo "max_pages_per_catalog must be between 1 and 100"
            exit 2
          fi
      - name: Survey selected Japanese CatCar catalog
        env:
          MAX_PAGES: ${{ inputs.max_pages_per_catalog }}
          MAKE: ${{ matrix.make }}
        run: |
          set -euo pipefail
          python -m tools.catcar_poc.crawl_catalog \
            --make "$MAKE" \
            --start-url "https://www.catcar.info/$MAKE/" \
            --max-pages "$MAX_PAGES" \
            --delay 10 \
            --timeout 30 \
            --output "out/catcar-$MAKE"
      - name: Upload catalog checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catcar-${{ matrix.make }}-crawl-${{ github.run_id }}
          path: out/catcar-${{ matrix.make }}/
          if-no-files-found: warn
          retention-days: 14
