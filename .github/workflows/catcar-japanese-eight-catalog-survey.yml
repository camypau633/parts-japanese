name: CatCar Japanese eight-catalog survey

on:
  workflow_dispatch:
    inputs:
      max_pages_per_catalog:
        description: "Maximum pages per catalog (1-100)"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: catcar-japanese-eight-catalog-survey
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Survey all eight Japanese CatCar catalog roots sequentially
        env:
          MAX_PAGES: ${{ inputs.max_pages_per_catalog }}
        run: |
          set -euo pipefail
          if ! [[ "$MAX_PAGES" =~ ^[0-9]+$ ]] || (( MAX_PAGES < 1 || MAX_PAGES > 100 )); then
            echo "max_pages_per_catalog must be between 1 and 100"
            exit 2
          fi

          makes=(toyota nissan honda suzuki mazda mitsubishi isuzu subaru)
          first=true
          for make in "${makes[@]}"; do
            if [ "$first" = false ]; then
              # Keep a minimum gap between requests even across crawler processes.
              sleep 10
            fi
            first=false
            echo "::group::CatCar survey: $make"
            python -m tools.catcar_poc.crawl_catalog \
              --make "$make" \
              --start-url "https://www.catcar.info/$make/" \
              --max-pages "$MAX_PAGES" \
              --delay 10 \
              --timeout 30 \
              --output "out/catcar-$make"
            echo "::endgroup::"
          done
      - name: Upload survey artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catcar-japanese-eight-catalog-survey-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
