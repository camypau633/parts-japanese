name: CatCar Nissan cross-brand probe
on:
  push:
    paths:
      - '.github/workflows/catcar-nissan-cross-brand-probe.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect Nissan catalog page and diagram data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          URL = "https://www.catcar.info/nissan/?"

          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,*/*",
                  "Accept-Language": "en-US,en;q=0.9"
              })
              last = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=35) as r:
                          return r.status, r.geturl(), r.read()
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as e:
                      last = e
                      if isinstance(e, urllib.error.HTTPError) and e.code not in (429,500,502,503,504):
                          raise
              raise last

          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows=[]; self.row=None; self.cell=None
                  self.links=[]; self.images=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="tr":
                      self.row=[]
                  elif tag in ("td","th") and self.row is not None:
                      self.cell=[]
                  elif tag=="a" and a.get("href"):
                      self.links.append({"text":"","href":a["href"],"class":a.get("class","")})
                  elif tag=="img" and (a.get("src") or a.get("data-src")):
                      self.images.append({"src":a.get("src") or a.get("data-src"),"alt":a.get("alt",""),"class":a.get("class","")})
                  elif tag=="script":
                      self.scripts.append(a.get("src","inline"))
              def handle_data(self,data):
                  if self.cell is not None: self.cell.append(data.strip())
                  if self.links: self.links[-1]["text"] += data.strip()
              def handle_endtag(self,tag):
                  if tag in ("td","th") and self.row is not None and self.cell is not None:
                      self.row.append(" ".join(" ".join(self.cell).split()))
                      self.cell=None
                  elif tag=="tr" and self.row is not None:
                      if any(self.row): self.rows.append(self.row)
                      self.row=None; self.cell=None

          status, final, body = get(URL)
          html=body.decode("utf-8","replace")
          open("out/nissan-pixo-catalog.html","w",encoding="utf-8").write(html)
          p=Inspect(); p.feed(html)
          print("HTTP",status,"FINAL_URL",final,"BYTES",len(body))
          print("TABLE_ROWS",len(p.rows),"LINKS",len(p.links),"IMAGES",len(p.images),"SCRIPTS",len(p.scripts))
          print("PAGE_TITLE",re.search(r"<title[^>]*>(.*?)</title>",html,re.I|re.S).group(1).strip() if re.search(r"<title[^>]*>(.*?)</title>",html,re.I|re.S) else "")
          print("SAMPLE_TABLE_ROWS",json.dumps(p.rows[:12],ensure_ascii=False))
          print("SAMPLE_LINKS",json.dumps(p.links[:25],ensure_ascii=False))
          print("SAMPLE_IMAGES",json.dumps(p.images[:25],ensure_ascii=False))
          print("SCRIPT_REFS",json.dumps(p.scripts[:30],ensure_ascii=False))
          print("HOTSPOT_MARKERS", {k:html.count(k) for k in ["srcTop","srcLeft","srcWidth","srcHeight","getArticles","groups-parts__item","detail"]})
          row_ids = set()
          for row in p.rows[1:]:
              if row:
                  row_ids.add(row[0].strip())

          coord_pattern = re.compile(
              r'<div\\b(?=[^>]*class=["\\'][^"\\']*\\bcoord\\b[^"\\']*["\\'])([^>]*)>',
              re.I | re.S
          )
          coords = []
          for match in coord_pattern.finditer(html):
              attrs = dict(re.findall(r'([\\w-]+)=["\\']([^"\\']*)["\\']', match.group(1)))
              item = {
                  "part_row": attrs.get("name", ""),
                  "src_num": attrs.get("srcNum", ""),
                  "top": attrs.get("srcTop", ""),
                  "left": attrs.get("srcLeft", ""),
                  "width": attrs.get("srcWidth", ""),
                  "height": attrs.get("srcHeight", "")
              }
              coords.append(item)

          coord_ids = set(x["src_num"] for x in coords if x["src_num"])
          matched = sorted(coord_ids & row_ids)
          unmatched = sorted(coord_ids - row_ids)
          image_urls = [urljoin(final, x["src"]) for x in p.images if x.get("src") and "page_" in x["src"]]
          diagram_result = []
          for image_url in image_urls[:3]:
              try:
                  st, image_final, image_body = get(image_url)
                  name = "out/diagram-%02d.png" % len(diagram_result)
                  open(name, "wb").write(image_body)
                  diagram_result.append({"url":image_final,"http":st,"bytes":len(image_body),"file":name})
              except Exception as e:
                  diagram_result.append({"url":image_url,"error":repr(e)})

          script_checks = []
          for script in p.scripts:
              if script.startswith("inline") or not script:
                  continue
              script_url = urljoin(final, script)
              try:
                  st, sf, sb = get(script_url)
                  js = sb.decode("utf-8","replace")
                  interesting = [line.strip() for line in js.splitlines() if "coord" in line.lower() or "srcNum" in line or "srcTop" in line]
                  script_checks.append({"url":sf,"http":st,"bytes":len(sb),"matches":interesting[:12]})
              except Exception as e:
                  script_checks.append({"url":script_url,"error":repr(e)})

          print("TABLE_PART_IDS",len(row_ids),"COORD_HOTSPOTS",len(coords),
                "UNIQUE_COORD_IDS",len(coord_ids),"MATCHED_IDS",len(matched),"UNMATCHED_IDS",len(unmatched))
          print("HOTSPOT_MATCH_SAMPLE",json.dumps(matched[:30],ensure_ascii=False))
          print("HOTSPOT_UNMATCHED",json.dumps(unmatched[:30],ensure_ascii=False))
          print("DIAGRAM_DOWNLOADS",json.dumps(diagram_result,ensure_ascii=False))
          print("SCRIPT_CHECKS",json.dumps(script_checks,ensure_ascii=False)[:7000])

          summary={
            "url":final,"http":status,"bytes":len(body),
            "table_rows":len(p.rows),"links":p.links,"images":p.images,
            "rows":p.rows,"scripts":p.scripts,
            "hotspot_markers":{k:html.count(k) for k in ["srcTop","srcLeft","srcWidth","srcHeight","getArticles","groups-parts__item"]},
            "table_part_ids":sorted(row_ids),"coords":coords,
            "coord_ids_matched_to_table":matched,"coord_ids_missing_from_table":unmatched,
            "diagram_downloads":diagram_result,"script_checks":script_checks
          }
          with open("out/nissan-pixo-inspection.json","w",encoding="utf-8") as f:
              json.dump(summary,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-nissan-cross-brand-inspection
          path: out/
          retention-days: 7
