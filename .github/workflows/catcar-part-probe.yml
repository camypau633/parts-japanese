name: CatCar part detail probe
on:
  push:
    paths:
      - '.github/workflows/catcar-part-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Expand one OEM row
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          TOKEN=''
          curl -sS -L --max-time 30 -A 'Mozilla/5.0' --get 'https://www.catcar.info/toyota/' --data-urlencode "l=$TOKEN" --data-urlencode 'st=81' -D out/headers.txt -o out/part-11302.html -w 'HTTP=%{http_code}\nSIZE=%{size_download}\nTYPE=%{content_type}\n' | tee out/result.txt
          echo '--- RESPONSE CONTENT ---'
          sed -n '1,220p' out/part-11302.html
          echo '--- LINKS AND IMAGES ---'
          grep -Eo 'href="[^"]+"|src="[^"]+"|[A-Z0-9-]{5,}' out/part-11302.html | sort -u | head -100 || true
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-part-11302-response
          path: out/
