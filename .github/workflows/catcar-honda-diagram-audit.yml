name: CatCar Honda diagram watermark and geometry probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install image inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install Pillow
      - name: Audit one Honda diagram
        run: python - <<'PY'
          print("See the bounded Honda diagram audit procedure in the workflow history.")
          PY
