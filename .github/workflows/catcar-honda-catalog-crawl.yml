name: CatCar Japanese bounded catalog crawl

on:
  workflow_dispatch:
    inputs:
      make:
        description: "Japanese vehicle make to crawl"
        required: true
        default: "honda"
        type: choice
        options:
          - honda
          - nissan
          - toyota
      max_pages:
        description: "Maximum pages to visit in this run (1-2000)"
        required: true
        default: "100"
        type: string
      resume_run_id:
        description: "Optional previous crawl workflow run ID to resume from"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: catcar-japanese-catalog-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Restore previous crawl artifact when requested
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          MAKE: ${{ inputs.make }}
        run: |
          set -euo pipefail
          mkdir -p "out/catcar-$MAKE"
          gh run download "$RESUME_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "catcar-$MAKE-crawl-$RESUME_RUN_ID" \
            --dir "out/catcar-$MAKE"
          test -s "out/catcar-$MAKE/crawl-state.json"
      - name: Run bounded crawler
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          MAKE: ${{ inputs.make }}
        run: |
          set -euo pipefail
          args=(
            --make "$MAKE"
            --start-url "https://www.catcar.info/$MAKE/"
            --max-pages "$MAX_PAGES"
            --delay 10
            --output "out/catcar-$MAKE"
          )
          if [ -s "out/catcar-$MAKE/crawl-state.json" ]; then
            args+=(--resume-state "out/catcar-$MAKE/crawl-state.json")
          fi
          python -m tools.catcar_poc.crawl_catalog "${args[@]}"
      - name: Upload crawl results for review
        uses: actions/upload-artifact@v4
        with:
          name: catcar-${{ inputs.make }}-crawl-${{ github.run_id }}
          path: out/catcar-${{ inputs.make }}/
          if-no-files-found: error
          retention-days: 14
