name: CatCar Honda bounded catalog crawl

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages to visit in this run (1-2000)"
        required: true
        default: "100"
        type: string
      resume_run_id:
        description: "Optional previous crawl workflow run ID to resume from"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: catcar-honda-catalog-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Restore previous crawl artifact when requested
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          mkdir -p out/catcar-honda
          gh run download "$RESUME_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "catcar-honda-crawl-$RESUME_RUN_ID" \
            --dir out/catcar-honda
          test -s out/catcar-honda/crawl-state.json
      - name: Run bounded crawler
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set -euo pipefail
          args=(
            --start-url "https://www.catcar.info/honda/"
            --max-pages "$MAX_PAGES"
            --delay 10
            --output out/catcar-honda
          )
          if [ -s out/catcar-honda/crawl-state.json ]; then
            args+=(--resume-state out/catcar-honda/crawl-state.json)
          fi
          python -m tools.catcar_poc.crawl_catalog "${args[@]}"
      - name: Upload crawl results for review
        uses: actions/upload-artifact@v4
        with:
          name: catcar-honda-crawl-${{ github.run_id }}
          path: out/catcar-honda/
          if-no-files-found: error
          retention-days: 14
