name: CatCar single-part AJAX probe

on:
  push:
    paths:
      - ".github/workflows/catcar-ajax-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request one Toyota 86 part expansion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          L=''
          curl --get --location --fail-with-body \
            --max-time 40 --connect-timeout 15 \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36" \
            --dump-header probe/response.headers \
            --output probe/response.html \
            --write-out "http_code=%{http_code}\ncontent_type=%{content_type}\nsize_download=%{size_download}\ntime_total=%{time_total}\n" \
            --data-urlencode "l=$L" \
            --data-urlencode "st=81" \
            "https://www.catcar.info/toyota/" | tee probe/result.txt
          echo "response_bytes=$(wc -c < probe/response.html)"
          echo "=== response preview (first 80 lines) ==="
          sed -n '1,80p' probe/response.html | sed -E 's/(<script[^>]*>).*$/\1[script omitted]/I'
          echo "=== likely article/part fields ==="
          grep -Eoi '([0-9]{5}[A-Z]?[- ]?[0-9A-Z]{0,5}|part number|article|quantity|price|number|name|15600A|15601)' probe/response.html | sort | uniq -c | head -60 || true
      - name: Save one-response evidence
        uses: actions/upload-artifact@v4
        with:
          name: catcar-single-part-response
          path: probe/
          retention-days: 7
