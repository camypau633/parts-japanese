name: CatCar Mitsubishi AJAX detail probe

on:
  push:
    paths:
      - ".github/workflows/catcar-mitsubishi-ajax-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request observed Mitsubishi part expansion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          L=''
          curl --get --location --fail-with-body \
            --max-time 45 --connect-timeout 15 \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36" \
            --dump-header probe/response.headers \
            --output probe/response.html \
            --write-out "http_code=%{http_code}\ncontent_type=%{content_type}\nsize_download=%{size_download}\ntime_total=%{time_total}\n" \
            --data-urlencode "l=$L" \
            --data-urlencode "st=81" \
            "https://www.catcar.info/mitsubishi/" | tee probe/result.txt
          echo "response_bytes=$(wc -c < probe/response.html)"
          echo "=== response table preview ==="
          sed -n '1,100p' probe/response.html | sed -E 's/(<script[^>]*>).*$/\1[script omitted]/I'
          echo "=== candidate OEM and metadata values ==="
          grep -Eoi '01100AR|B608K409A|[0-9A-Z]{5,}[- ][0-9A-Z-]+|part number|номер детали|production|period|model|applicab|date' probe/response.html | sort | uniq -c | head -80 || true
      - name: Save response evidence
        uses: actions/upload-artifact@v4
        with:
          name: catcar-mitsubishi-ajax-detail
          path: probe/
          retention-days: 14
