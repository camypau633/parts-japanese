name: CatCar Mitsubishi AJAX detail probe

on:
  push:
    paths:
      - ".github/workflows/catcar-mitsubishi-ajax-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture Mitsubishi OEM expansion and follow-up
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          L=''
          curl --get --location --fail-with-body --max-time 45 --connect-timeout 15 \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36" \
            --dump-header probe/response.headers --output probe/response.html \
            --write-out "http_code=%{http_code}\ncontent_type=%{content_type}\nsize_download=%{size_download}\ntime_total=%{time_total}\n" \
            --data-urlencode "l=$L" "https://www.catcar.info/mitsubishi/" | tee probe/result.txt
          echo "=== OEM response ==="
          sed -n '1,120p' probe/response.html
          curl --get --location --fail-with-body --max-time 45 --connect-timeout 15 \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36" \
            --dump-header probe/oem-detail.headers --output probe/oem-detail.html \
            --write-out "http_code=%{http_code}\ncontent_type=%{content_type}\nsize_download=%{size_download}\ntime_total=%{time_total}\n" \
            --data-urlencode "l=$L" "https://www.catcar.info/mitsubishi/" | tee probe/oem-detail-result.txt
          echo "=== OEM follow-up response ==="
          sed -n '1,160p' probe/oem-detail.html
          echo "=== diagram and coordinate markers ==="
          grep -Eoi 'img[^>]+|coord[^>]+|srcNum|srcTop|srcLeft|srcWidth|srcHeight|MD155451|period|production|number|name' probe/oem-detail.html | head -120 || true
      - name: Save both response bodies and headers
        uses: actions/upload-artifact@v4
        with:
          name: catcar-mitsubishi-ajax-detail
          path: probe/
          retention-days: 14
