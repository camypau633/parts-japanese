name: CatCar script inspection

on:
  push:
    paths:
      - ".github/workflows/catcar-script-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch CatCar frontend script
        shell: bash
        run: |
          set +e
          mkdir -p inspect
          curl -L --max-time 35 --connect-timeout 15 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36" \
            -D inspect/script.headers \
            -o inspect/script.js \
            -w "http_code=%{http_code}\ncontent_type=%{content_type}\nsize_download=%{size_download}\ntime_total=%{time_total}\n" \
            "https://www.catcar.info/js/script.js?v=2.0" > inspect/script.result 2> inspect/script.error
          cat inspect/script.result
          echo "bytes=$(wc -c < inspect/script.js 2>/dev/null || echo 0)"
          if [ -s inspect/script.js ]; then
            echo "=== relevant function locations ==="
            grep -n -E "getArticles|ajax\(|\.post\(|\.get\(|XMLHttpRequest|fetch\(" inspect/script.js | head -100 || true
          fi
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: catcar-script-inspection
          path: inspect/
          retention-days: 7
