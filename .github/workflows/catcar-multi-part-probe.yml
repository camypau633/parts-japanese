name: CatCar nested groups probe
on:
  push:
    paths:
      - '.github/workflows/catcar-multi-part-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe nested groups and extract part responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import re, json, urllib.parse, urllib.request
          from html.parser import HTMLParser

          BASE = "https://www.catcar.info/toyota/"
          GROUP_URL = "https://www.catcar.info/toyota/?%3D"
          HEADERS = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36"}

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, response.read().decode("utf-8", "replace")

          class RowParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows, self.current = [], None
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "tr":
                      self.current = {"attrs": attrs, "text": "", "onclick": attrs.get("onclick", "")}
                  elif self.current is not None and attrs.get("onclick"):
                      self.current["onclick"] += " " + attrs["onclick"]
              def handle_data(self, data):
                  if self.current is not None:
                      self.current["text"] += data
              def handle_endtag(self, tag):
                  if tag == "tr" and self.current is not None:
                      self.rows.append(self.current)
                      self.current = None

          def rows_from(html):
              parser = RowParser()
              parser.feed(html)
              return parser.rows

          def row_token(row, state):
              click = row["onclick"]
              if "getArticles" not in click or (", %s," % state) not in click:
                  return None
              pieces = click.split("'")
              return pieces[1] if len(pieces) > 1 else None

          def request_token(token, state):
              return get(BASE + "?" + urllib.parse.urlencode({"l": token, "st": str(state)}))

          status, root = get(GROUP_URL)
          open("out/root-group.html", "w", encoding="utf-8").write(root)
          print("ROOT_HTTP", status, "BYTES", len(root))
          root_rows = rows_from(root)
          subgroups = []
          for row in root_rows:
              token = row_token(row, 70)
              if token:
                  label = " ".join(row["text"].split())[:180]
                  subgroups.append((token, label))
          print("SUBGROUP_ROWS", len(subgroups))

          results = []
          seen = set()
          for group_index, (group_token, group_label) in enumerate(subgroups[:4], 1):
              try:
                  code, group_html = request_token(group_token, 70)
                  group_file = "out/subgroup-%d.html" % group_index
                  open(group_file, "w", encoding="utf-8").write(group_html)
                  part_rows = rows_from(group_html)
                  candidates = []
                  for row in part_rows:
                      token = row_token(row, 80)
                      if token and token not in seen:
                          seen.add(token)
                          candidates.append((token, " ".join(row["text"].split())[:180]))
                  print("SUBGROUP", group_index, json.dumps({"label":group_label,"http":code,"bytes":len(group_html),"part_rows":len(candidates)}, ensure_ascii=False))
                  for token, label in candidates[:3]:
                      pcode, part_html = request_token(token, 81)
                      part_file = "out/part-%d.html" % (len(results)+1)
                      open(part_file, "w", encoding="utf-8").write(part_html)
                      # Preserve full OEM strings including prefixes and hyphens.
                      cells = re.findall(r">\s*([A-Z0-9]{2,}(?:-[A-Z0-9]+)+|[A-Z]{1,4}[0-9]{4,}[A-Z0-9]*)\s*<", part_html, re.I)
                      item = {"group":group_label,"row":label,"http":pcode,"bytes":len(part_html),"file":part_file,"oem_candidates":sorted(set(cells))}
                      results.append(item)
                      print("PART_RESULT", json.dumps(item, ensure_ascii=False))
              except Exception as exc:
                  print("SUBGROUP_ERROR", group_index, str(exc))
          open("out/summary.json","w",encoding="utf-8").write(json.dumps(results,ensure_ascii=False,indent=2))
          print("TOTAL_PART_RESPONSES",len(results))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-nested-group-responses
          path: out/
          retention-days: 7
