name: CatCar Honda Civic model probe

on:
  push:
    paths:
      - '.github/workflows/catcar-honda-model-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect one Honda model page without traversing catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sleep 10
          python - <<'PY'
          import json
          import re
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit

          URL = "https://www.catcar.info/honda/?l=bW9kbmFtZT09Q0lWSUN8fGRvb3Jycz09M3x8eWVhcj09MjAxMXx8c3Q9PTMwfHxzdHM9PXsiMjAiOiJcdTA0MTVcdTA0MzJcdTA0NDBcdTA0M2VcdTA0M2ZcdTA0MzAiLCIzMCI6IjIwMTEgQ0lWSUMifQ%3D%3D"
          request = urllib.request.Request(URL, headers={
              "User-Agent": "PartScope-Japanese-Catalog-Discovery/1.0",
              "Accept": "text/html,application/xhtml+xml"
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              status, final_url = response.status, response.geturl()
              body = response.read(4 * 1024 * 1024 + 1)
          if len(body) > 4 * 1024 * 1024:
              raise SystemExit("Honda model page exceeded 4 MiB inspection limit")
          html = body.decode("utf-8", "replace")
          open("out/honda-civic-model.html", "w", encoding="utf-8").write(html)

          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows=[]; self.row=None; self.cell=None
                  self.links=[]; self.images=[]; self.scripts=[]
                  self.title=False; self.title_text=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="title": self.title=True
                  elif tag=="tr": self.row=[]
                  elif tag in ("td","th") and self.row is not None: self.cell=[]
                  elif tag=="a" and a.get("href"): self.links.append({"href":a["href"],"text":""})
                  elif tag=="img" and (a.get("src") or a.get("data-src")):
                      self.images.append({"src":a.get("src") or a.get("data-src"),"alt":a.get("alt",""),"class":a.get("class","")})
                  elif tag=="script": self.scripts.append(a.get("src","inline"))
              def handle_data(self, data):
                  if self.title: self.title_text.append(data.strip())
                  if self.cell is not None: self.cell.append(data.strip())
                  if self.links: self.links[-1]["text"] += data.strip()
              def handle_endtag(self, tag):
                  if tag=="title": self.title=False
                  elif tag in ("td","th") and self.cell is not None and self.row is not None:
                      self.row.append(" ".join(" ".join(self.cell).split())); self.cell=None
                  elif tag=="tr" and self.row is not None:
                      if any(self.row): self.rows.append(self.row)
                      self.row=None; self.cell=None
                  elif tag=="a" and self.links: pass

          parser=Inspect(); parser.feed(html)
          links=[]
          for item in parser.links:
              target=urljoin(final_url,item["href"])
              host=(urlsplit(target).hostname or "").lower()
              if host=="catcar.info" or host.endswith(".catcar.info"):
                  links.append({"text":" ".join(item["text"].split()),"url":target})
          coords=re.findall(r'<div\b(?=[^>]*class=["\'][^"\']*\bcoord\b[^"\']*["\'])([^>]*)>',html,re.I|re.S)
          hotspots=[]
          for raw in coords:
              attrs=dict(re.findall(r'([\w-]+)=["\']([^"\']*)["\']',raw))
              hotspots.append({k:attrs.get(k,"") for k in ("name","srcNum","srcTop","srcLeft","srcWidth","srcHeight")})
          diagrams=[]
          for item in parser.images:
              src=item["src"]
              if any(x in src.lower() for x in (".png",".jpg",".jpeg")) and "logo" not in src.lower():
                  diagrams.append({"url":urljoin(final_url,src),"alt":item["alt"],"class":item["class"]})
          result={
              "make":"Honda","selected_model":"Civic","catalog_year":"2011",
              "scope":"one Japanese manufacturer page only; no bulk traversal",
              "http_status":status,"final_url":final_url,"bytes":len(body),
              "title":" ".join(x for x in parser.title_text if x),
              "table_rows":len(parser.rows),"table_sample":parser.rows[:35],
              "links":links[:100],"images":parser.images[:60],
              "diagram_candidates":diagrams[:10],"hotspots":hotspots[:100],
              "hotspot_count":len(hotspots),"script_refs":parser.scripts[:60],
              "marker_counts":{k:html.count(k) for k in ("srcNum","srcTop","srcLeft","getArticles","groups-parts__item")}
          }
          open("out/honda-civic-inspection.json","w",encoding="utf-8").write(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if status!=200: raise SystemExit("Honda model page did not return HTTP 200")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catcar-honda-civic-inspection
          path: out/
          retention-days: 7
